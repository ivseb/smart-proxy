apiVersion: v1
entries:
  smart-proxy:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Uptime monitors and health checks never keep applications awake or wake them (ignore.* values)
        - kind: added
          description: Routes balancing several Services keep their split; only managed backends sleep and wake
        - kind: added
          description: OpenShift DeploymentConfigs (Role covers apps.openshift.io with rbac.openshiftRoutes)
        - kind: fixed
          description: Deleting a route restores every Ingress/Route it patched
        - kind: fixed
          description: Route target ports are resolved and restored exactly
      artifacthub.io/images: |
        - name: smart-proxy
          image: docker.io/isebben/smart-proxy:2.1.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: source
          url: https://github.com/ivseb/smart-proxy
        - name: documentation
          url: https://ivseb.github.io/smart-proxy/
      artifacthub.io/maintainers: |
        - name: ivseb
          email: ivan.sebben.dati@gmail.com
    apiVersion: v2
    appVersion: 2.1.0
    created: "2026-10-09T12:34:51.905905006Z"
    description: Intelligent request handling for Kubernetes Ingresses and OpenShift
      Routes — auto-sleep, dependency chains and unified route patching.
    digest: 4041c274461dc9888db492a879b4a457d30548a842578a14c51561c279c69158
    home: https://ivseb.github.io/smart-proxy/
    icon: https://raw.githubusercontent.com/ivseb/smart-proxy/main/media/logo.png
    keywords:
    - proxy
    - kubernetes
    - openshift
    - ingress
    - autoscaling
    maintainers:
    - name: ivseb
    name: smart-proxy
    sources:
    - https://github.com/ivseb/smart-proxy
    type: application
    urls:
    - https://github.com/ivseb/smart-proxy/releases/download/smart-proxy-0.3.0/smart-proxy-0.3.0.tgz
    version: 0.3.0
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Declarative routes from smart-proxy/* annotations on Ingresses/Routes (GitOps)
        - kind: added
          description: StatefulSets can be put to sleep and woken like Deployments (Role covers statefulsets)
        - kind: added
          description: Prometheus metrics on a dedicated port, with an optional ServiceMonitor
        - kind: added
          description: High availability, 2 replicas by default sharing routes (ConfigMap) and activity, with leader election and a PodDisruptionBudget
        - kind: added
          description: Uninstalling restores patched Ingresses/Routes and wakes sleeping Deployments (restoreOnUninstall)
        - kind: added
          description: Manage several namespaces (watchNamespaces), all of them (allNamespaces), or labelled ones (namespaceSelector)
        - kind: added
          description: Dashboard authentication (basic, token, OIDC, OpenShift oauth-proxy or trusted header), basic auth enabled by default
        - kind: fixed
          description: Patched Ingresses/Routes now target the release Service name instead of a hardcoded "smart-proxy"
        - kind: added
          description: Liveness and readiness probes on /__smart_proxy/healthz, with graceful shutdown
        - kind: fixed
          description: Route configurations are saved to /data, so the optional PersistentVolumeClaim is actually used
        - kind: changed
          description: Role can read HorizontalPodAutoscalers, so deployments wake at their original size or HPA minReplicas
      artifacthub.io/images: |
        - name: smart-proxy
          image: docker.io/isebben/smart-proxy:2.0.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: source
          url: https://github.com/ivseb/smart-proxy
        - name: documentation
          url: https://ivseb.github.io/smart-proxy/
      artifacthub.io/maintainers: |
        - name: ivseb
          email: ivan.sebben.dati@gmail.com
