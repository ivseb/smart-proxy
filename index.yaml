    maintainers:
    - name: ivseb
    name: smart-proxy
    sources:
    - https://github.com/ivseb/smart-proxy
    type: application
    urls:
    - https://github.com/ivseb/smart-proxy/releases/download/smart-proxy-0.5.0/smart-proxy-0.5.0.tgz
    version: 0.5.0
  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: Applications in other namespaces than Smart Proxy's are reachable once patched (stand-in Services; new RBAC)
        - kind: fixed
          description: With two replicas, an app woken by a follower is no longer put back to sleep by the leader
        - kind: fixed
          description: API calls, form posts and WebSockets to a sleeping app wait for it instead of getting the HTML waking page
        - kind: fixed
          description: Routing follows the routers (host first, whole path segments, wildcards, Exact paths)
        - kind: changed
          description: Self-healing backs off from GitOps tools that keep reverting it
        - kind: added
          description: Traffic charts keep the last 30 minutes (config.statsRetention); h2c/gRPC; end-to-end tests
      artifacthub.io/images: |
        - name: smart-proxy
          image: docker.io/isebben/smart-proxy:2.2.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: source
          url: https://github.com/ivseb/smart-proxy
        - name: documentation
          url: https://ivseb.github.io/smart-proxy/
      artifacthub.io/maintainers: |
        - name: ivseb
          email: ivan.sebben.dati@gmail.com
