apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-proxy
  namespace: smart-proxy
  labels:
    app: smart-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-proxy
  template:
    metadata:
      labels:
        app: smart-proxy
    spec:
      serviceAccountName: smart-proxy-sa
      containers:
        - name: smart-proxy
          image: isebben/smart-proxy:latest # Docker Hub image; override for your own build
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: proxy
            - containerPort: 8081
              name: admin
          livenessProbe:
            httpGet:
              path: /__smart_proxy/healthz
              port: proxy
          readinessProbe:
            httpGet:
              path: /__smart_proxy/readyz
              port: proxy
            periodSeconds: 5
            failureThreshold: 1
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          env:
            - name: CONFIG_PATH
              value: /data/routes.json
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SMART_PROXY_DEPLOYMENT
              value: smart-proxy
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {} # For persistence, use a PVC
