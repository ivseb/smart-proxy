<!DOCTYPE html>
<html lang="{{.L}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{.L.T "Waking up…"}}</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:420px;padding:24px;text-align:center}
.icon{position:relative;width:88px;height:88px;margin:0 auto 28px}
.icon .glow{position:absolute;inset:0;border-radius:50%;background:#3b82f6;filter:blur(18px);opacity:.45;animation:glow 2.4s ease-in-out infinite}
.icon .disc{position:relative;width:88px;height:88px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}@keyframes glow{50%{transform:scale(1.25);opacity:.2}}
h1{margin:0 0 8px;font-size:26px}
.lead{margin:0 0 28px;color:#94a3b8;font-size:15px;line-height:1.5}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;text-align:left}
.card h2{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.name{display:flex;align-items:center;gap:10px;min-width:0;color:#cbd5e1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#475569}
.state{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#94a3b8;flex:none}
.Ready .dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}.Ready .state{color:#4ade80}
.Scaling .dot{background:#eab308;animation:pulse 1.2s ease-in-out infinite}.Scaling .state{color:#facc15}
.Error .dot{background:#ef4444}.Error .state{color:#f87171}
.note{font-size:13px;color:#94a3b8}.note.err{color:#f87171}
.done{font-size:22px;font-weight:700;color:#4ade80}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="icon"><div class="glow"></div><div class="disc">
    <svg width="44" height="44" fill="none" stroke="#fff" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
  </div></div>
  <h1>{{.L.T "Waking up"}}</h1>
  <p class="lead">{{.L.T "This application was asleep to save resources. It's starting now: this page reloads by itself when it's ready."}}</p>
  <section class="card" aria-live="polite">
    <h2>{{.L.T "Starting"}}</h2>
    <div id="status"><div class="note">{{.L.T "Connecting…"}}</div></div>
  </section>
</main>
<script>
const T = {{.Texts}};
const LABELS = { Ready: T["Ready"], Scaling: T["Starting…"], Sleep: T["Waiting"], Error: T["Error"] };
const box = document.getElementById("status");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

async function check() {
  try {
    // Keep the current subpath, so path-based reverse proxies forward the check to Smart Proxy.
    const path = location.pathname;
    const base = path.replace(/\/+$/, "");
    const res = await fetch(`${base}/__smart_proxy/status?path=${encodeURIComponent(path)}&host=${encodeURIComponent(location.host)}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (data.status === "ready") {
      document.querySelector("main").replaceChildren(el("div", "done", "🚀 " + T["Ready! Opening…"]));
      setTimeout(() => location.reload(), 500);
      return;
    }
    if (data.details) {
      box.replaceChildren(...data.details.map(d => {
        const row = el("div", "row " + d.status);
        const name = el("span", "name");
        name.append(el("span", "dot"), el("span", "", d.name));
        row.append(name, el("span", "state", LABELS[d.status] || T["Checking…"]));
        return row;
      }));
    }
  } catch {
    box.replaceChildren(el("div", "note err", T["Connection lost, retrying…"]));
  }
  setTimeout(check, 1000);
}
check();
</script>
</body>
</html>
