# Weekly updates of what ends up in the image (Go modules, base images) and of the build tools,
# so security fixes arrive as pull requests instead of CVE reports.
version: 2
updates:
  # Daily for what is in the image: Go modules and the Go version (golang image), so fixes are
  # released (.github/workflows/auto-release.yml) within a day.
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: daily }
    groups:
      go-modules: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: daily }
  - package-ecosystem: npm
    directory: /web/dashboard
    schedule: { interval: weekly }
    groups:
      dashboard: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
