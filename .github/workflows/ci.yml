name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Also run by the automatic release of dependency updates, on the commit to release.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress. The automatic
# release's run (on its own commit) is never cancelled by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref || 'push' }}
  cancel-in-progress: true

jobs:
  # The end-to-end tests (about 9 minutes) only when something they exercise changed: not for the
  # dashboard alone, the docs or the other workflows. The automatic release always runs them.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Paths changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          e2e=true
          if { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD
            git diff --name-only "$BASE" HEAD | grep -qE '^(cmd/|internal/|test/e2e/|charts/|Dockerfile$|go\.(mod|sum)$|\.github/workflows/ci\.yml$)' || e2e=false
          fi
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The Go version is the one the image is built with (the Dockerfile's golang image, kept up
      # to date by Dependabot).
      - name: Go version
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Known vulnerabilities in the Go version or the modules used: none allowed.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The Node version the dashboard is built with in the image (the Dockerfile's node image).
      - name: Node version
        id: node
        run: echo "version=$(sed -n 's/^FROM node:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/smart-proxy

      - name: Render every auth mode
        run: |
          set -e
          render() { helm template ci charts/smart-proxy "$@" > /dev/null; }
          for mode in none basic token header; do render --set auth.mode=$mode; done
          render --set auth.mode=openshift --set route.enabled=true --set route.host=admin.example.com
          render --set auth.mode=oidc --set ingress.enabled=true --set ingress.host=admin.example.com \
            --set auth.oidc.issuerURL=https://idp.example.com --set auth.oidc.clientID=sp \
            --set auth.oidc.clientSecret=secret --set 'auth.oidc.allowedDomains={example.com}'
          render --set 'config.watchNamespaces={team-a,team-b}'
          render --set config.allNamespaces=true
          render --set config.namespaceSelector=smart-proxy=enabled
          render --set restoreOnUninstall=false
          render --api-versions route.openshift.io/v1 --set rbac.openshiftRoutes=false
          # Invalid settings must fail the install.
          if render --set auth.mode=oidc 2>/dev/null; then echo "incomplete oidc config was accepted"; exit 1; fi

  e2e:
    name: End-to-end (kind)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The Go version is the one the image is built with (the Dockerfile's golang image, kept up
      # to date by Dependabot).
      - name: Go version
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run test/e2e
        run: test/e2e/run.sh

