name: Security

# Vulnerabilities are found after a release too: every week, scan the published image and the
# code on main again. A failure means a new CVE: update the dependency (or Go) and release.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Published image
    runs-on: ubuntu-latest
    steps:
      - name: Scan isebben/smart-proxy:latest (Trivy)
        run: |
          docker run --rm aquasec/trivy:0.63.0 \
            image --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 docker.io/isebben/smart-proxy:latest

  code:
    name: Go code on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Go version is the one the image is built with (the Dockerfile's golang image, kept up
      # to date by Dependabot).
      - name: Go version
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...
