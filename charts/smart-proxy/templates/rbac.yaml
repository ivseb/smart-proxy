{{- if .Values.rbac.create -}}
{{- $fullname := include "smart-proxy.fullname" . -}}
{{- $clusterWide := eq (include "smart-proxy.clusterWide" .) "true" -}}
{{- if $clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
rules:
  {{- include "smart-proxy.rbacRules" . | nindent 2 }}
  # Discover namespaces (and their labels, for namespaceSelector).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smart-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $fullname }}-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
{{- range $ns := include "smart-proxy.watchedNamespaces" . | fromJsonArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-role
  namespace: {{ $ns }}
  labels:
    {{- include "smart-proxy.labels" $ | nindent 4 }}
rules:
  {{- include "smart-proxy.rbacRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-binding
  namespace: {{ $ns }}
  labels:
    {{- include "smart-proxy.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smart-proxy.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
