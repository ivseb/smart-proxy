{{- if .Values.rbac.create -}}
{{- $fullname := include "smart-proxy.fullname" . -}}
{{- $clusterWide := eq (include "smart-proxy.clusterWide" .) "true" -}}
{{- if $clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
rules:
  {{- include "smart-proxy.rbacRules" . | nindent 2 }}
  # Discover namespaces (and their labels, for namespaceSelector).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ .Release.Namespace }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smart-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $fullname }}-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
{{- range $ns := include "smart-proxy.watchedNamespaces" . | fromJsonArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-role
  namespace: {{ $ns }}
  labels:
    {{- include "smart-proxy.labels" $ | nindent 4 }}
rules:
  {{- include "smart-proxy.rbacRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-binding
  namespace: {{ $ns }}
  labels:
    {{- include "smart-proxy.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smart-proxy.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
---
# In Smart Proxy's own namespace: shared routes and activity (ConfigMaps), leader election
# (Lease), and stopping Smart Proxy before the uninstall Job restores applications.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-self
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $fullname | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Its own Service's endpoints, mirrored into the stand-ins of other namespaces.
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  # Its own Secret (<release>-state): peer token, login key, hashed route credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-state" $fullname | quote }}]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-self
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smart-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-self
  apiGroup: rbac.authorization.k8s.io
{{- end }}
