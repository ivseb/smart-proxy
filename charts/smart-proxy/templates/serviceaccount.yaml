{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smart-proxy.serviceAccountName" . }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations (eq .Values.auth.mode "openshift") }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq .Values.auth.mode "openshift" }}
    {{- /* Registers the ServiceAccount as an OAuth client allowed to redirect to the dashboard. */}}
    {{- if .Values.route.enabled }}
    serviceaccounts.openshift.io/oauth-redirectreference.primary: {{ printf `{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"%s-admin"}}` (include "smart-proxy.fullname" .) | quote }}
    {{- else }}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: {{ include "smart-proxy.adminURL" . | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
