apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-proxy.fullname" . }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "smart-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smart-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $authMode := .Values.auth.mode }}
      {{- $authSecret := include "smart-proxy.authSecretName" . }}
      serviceAccountName: {{ include "smart-proxy.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.config.proxyPort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            - name: admin
              containerPort: {{ .Values.config.adminPort }}
          env:
            {{- include "smart-proxy.scopeEnv" . | nindent 12 }}
            - name: IGNORE_DEFAULT_USER_AGENTS
              value: {{ .Values.ignore.defaultUserAgents | quote }}
            {{- with .Values.ignore.userAgents }}
            - name: IGNORE_USER_AGENTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ignore.paths }}
            - name: IGNORE_PATHS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ignore.sources }}
            - name: IGNORE_SOURCES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ignore.methods }}
            - name: IGNORE_METHODS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ignore.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: METRICS_ADDR
              value: {{ printf ":%v" .Values.metrics.port | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SMART_PROXY_DEPLOYMENT
              value: {{ include "smart-proxy.fullname" . | quote }}
            - name: SMART_PROXY_PORT
              value: {{ .Values.config.proxyPort | quote }}
            - name: CONFIG_PATH
              value: /data/routes.json
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: STATS_RETENTION
              value: {{ .Values.config.statsRetention | default "30m" | quote }}
            - name: ADMIN_ADDR
              value: {{ printf ":%v" .Values.config.adminPort | quote }}
            - name: AUTH_MODE
              value: {{ $authMode | quote }}
            - name: AUTH_SESSION_TTL
              value: {{ .Values.auth.sessionTTL | quote }}
            {{- if eq $authMode "basic" }}
            - name: AUTH_BASIC_USERNAME
              value: {{ .Values.auth.basic.username | quote }}
            - name: AUTH_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: basic-password
            {{- end }}
            {{- if eq $authMode "token" }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: token
            {{- end }}
            {{- if or (eq $authMode "token") (eq $authMode "oidc") (eq $authMode "openshift") }}
            {{- $sessionKey := "session-secret" }}
            {{- /* An existing Secret made for the oauth-proxy sidecar has a cookie-secret: it signs sessions now. */}}
            {{- with and .Values.auth.existingSecret (lookup "v1" "Secret" .Release.Namespace .Values.auth.existingSecret) }}
            {{- if and (not (hasKey (.data | default dict) "session-secret")) (hasKey (.data | default dict) "cookie-secret") }}
            {{- $sessionKey = "cookie-secret" }}
            {{- end }}
            {{- end }}
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ $sessionKey }}
                  optional: true
            {{- end }}
            {{- if eq $authMode "oidc" }}
            {{- $oidc := .Values.auth.oidc }}
            - name: AUTH_OIDC_ISSUER_URL
              value: {{ $oidc.issuerURL | quote }}
            - name: AUTH_OIDC_CLIENT_ID
              value: {{ $oidc.clientID | quote }}
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: oidc-client-secret
            - name: AUTH_OIDC_REDIRECT_URL
              value: {{ $oidc.redirectURL | default (printf "%s/auth/callback" (include "smart-proxy.adminURL" .)) | quote }}
            - name: AUTH_OIDC_SCOPES
              value: {{ $oidc.scopes | quote }}
            - name: AUTH_OIDC_USERNAME_CLAIM
              value: {{ $oidc.usernameClaim | quote }}
            - name: AUTH_OIDC_GROUPS_CLAIM
              value: {{ $oidc.groupsClaim | quote }}
            - name: AUTH_OIDC_ALLOWED_EMAILS
              value: {{ join "," $oidc.allowedEmails | quote }}
            - name: AUTH_OIDC_ALLOWED_DOMAINS
              value: {{ join "," $oidc.allowedDomains | quote }}
            - name: AUTH_OIDC_ALLOWED_GROUPS
              value: {{ join "," $oidc.allowedGroups | quote }}
            - name: AUTH_OIDC_ALLOW_ALL
              value: {{ $oidc.allowAll | quote }}
            {{- end }}
            {{- if eq $authMode "header" }}
            - name: AUTH_HEADER_USER
              value: {{ .Values.auth.header.userHeader | quote }}
            - name: AUTH_HEADER_LOGOUT_URL
              value: {{ .Values.auth.header.logoutURL | quote }}
            {{- end }}
            {{- if eq $authMode "openshift" }}
            {{- $os := .Values.auth.openshift }}
            - name: AUTH_OPENSHIFT_SERVICE_ACCOUNT
              value: {{ include "smart-proxy.serviceAccountName" . | quote }}
            - name: AUTH_OPENSHIFT_REDIRECT_URL
              value: {{ printf "%s/auth/callback" (include "smart-proxy.adminURL" .) | quote }}
            {{- with $os.sar }}
            - name: AUTH_OPENSHIFT_SAR
              value: {{ . | quote }}
            {{- end }}
            {{- with $os.oauthURL }}
            - name: AUTH_OPENSHIFT_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $os.caConfigMap }}
            - name: AUTH_OPENSHIFT_CA_FILE
              value: /etc/smart-proxy/openshift-ca/{{ $os.caKey | default "ca.crt" }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /__smart_proxy/healthz
              port: proxy
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /__smart_proxy/readyz
              port: proxy
            periodSeconds: 5
            failureThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if and (eq $authMode "openshift") .Values.auth.openshift.caConfigMap }}
            - name: openshift-ca
              mountPath: /etc/smart-proxy/openshift-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if and (eq $authMode "openshift") .Values.auth.openshift.caConfigMap }}
        - name: openshift-ca
          configMap:
            name: {{ .Values.auth.openshift.caConfigMap | quote }}
        {{- end }}
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smart-proxy.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "smart-proxy.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
