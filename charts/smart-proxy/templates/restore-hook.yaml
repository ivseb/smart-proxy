{{- if .Values.restoreOnUninstall }}
# Runs before Helm deletes anything (the ServiceAccount and RBAC still exist): undoes every
# patch and wakes sleeping Deployments, so applications don't break when Smart Proxy goes away.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "smart-proxy.fullname" . }}-restore
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        # Not the Deployment's selector labels: the Service must not send traffic to this pod.
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "smart-proxy.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["restore"]
          env:
            {{- include "smart-proxy.scopeEnv" . | nindent 12 }}
            # Stopped first, so its self-healing can't re-patch what the Job restores.
            - name: SMART_PROXY_DEPLOYMENT
              value: {{ include "smart-proxy.fullname" . | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
