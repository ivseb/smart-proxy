{{- include "smart-proxy.validateAuth" . -}}
{{- if and (ne .Values.auth.mode "none") (ne .Values.auth.mode "header") (not .Values.auth.existingSecret) -}}
{{- $name := include "smart-proxy.authSecretName" . -}}
{{- /* Reuse generated values on upgrade so passwords and sessions survive. */ -}}
{{- $current := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $current = .data | default dict -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "smart-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if eq .Values.auth.mode "basic" }}
  basic-password: {{ .Values.auth.basic.password | b64enc | default (get $current "basic-password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "token" }}
  token: {{ .Values.auth.token.token | b64enc | default (get $current "token") | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "oidc" }}
  oidc-client-secret: {{ .Values.auth.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if or (eq .Values.auth.mode "token") (eq .Values.auth.mode "oidc") }}
  session-secret: {{ get $current "session-secret" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "openshift" }}
  {{- /* oauth-proxy needs a 16, 24 or 32 byte cookie secret. */}}
  cookie-secret: {{ get $current "cookie-secret" | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
{{- end }}
