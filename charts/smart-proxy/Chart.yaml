apiVersion: v2
name: smart-proxy
description: Intelligent request handling for Kubernetes Ingresses and OpenShift Routes — auto-sleep, dependency chains and unified route patching.
type: application
# Chart version. Bump on every change to the chart itself.
version: 0.2.0
# Version of the Smart Proxy application shipped by default.
appVersion: "latest"
home: https://ivseb.github.io/smart-proxy/
icon: https://raw.githubusercontent.com/ivseb/smart-proxy/main/media/logo.png
sources:
  - https://github.com/ivseb/smart-proxy
maintainers:
  - name: ivseb
keywords:
  - proxy
  - kubernetes
  - openshift
  - ingress
  - autoscaling
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ivseb/smart-proxy
    - name: documentation
      url: https://ivseb.github.io/smart-proxy/
  artifacthub.io/images: |
    - name: smart-proxy
      image: docker.io/isebben/smart-proxy:latest
  artifacthub.io/maintainers: |
    - name: ivseb
      email: ivan.sebben.dati@gmail.com
  artifacthub.io/changes: |
    - kind: added
      description: Uninstalling restores patched Ingresses/Routes and wakes sleeping Deployments (restoreOnUninstall)
    - kind: added
      description: Manage several namespaces (watchNamespaces), all of them (allNamespaces), or labelled ones (namespaceSelector)
    - kind: added
      description: Dashboard authentication (basic, token, OIDC, OpenShift oauth-proxy or trusted header), basic auth enabled by default
    - kind: fixed
      description: Patched Ingresses/Routes now target the release Service name instead of a hardcoded "smart-proxy"
    - kind: added
      description: Liveness and readiness probes on /__smart_proxy/healthz, with graceful shutdown
    - kind: fixed
      description: Route configurations are saved to /data, so the optional PersistentVolumeClaim is actually used
    - kind: changed
      description: Role can read HorizontalPodAutoscalers, so deployments wake at their original size or HPA minReplicas
