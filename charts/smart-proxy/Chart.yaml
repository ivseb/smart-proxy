apiVersion: v2
name: smart-proxy
description: Intelligent request handling for Kubernetes Ingresses and OpenShift Routes — auto-sleep, dependency chains and unified route patching.
type: application
# Chart version. Bump on every change to the chart itself.
version: 0.3.0
# Version of the Smart Proxy application shipped by default.
appVersion: "2.1.0"
home: https://ivseb.github.io/smart-proxy/
icon: https://raw.githubusercontent.com/ivseb/smart-proxy/main/media/logo.png
sources:
  - https://github.com/ivseb/smart-proxy
maintainers:
  - name: ivseb
keywords:
  - proxy
  - kubernetes
  - openshift
  - ingress
  - autoscaling
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ivseb/smart-proxy
    - name: documentation
      url: https://ivseb.github.io/smart-proxy/
  artifacthub.io/images: |
    - name: smart-proxy
      image: docker.io/isebben/smart-proxy:2.1.0
  artifacthub.io/maintainers: |
    - name: ivseb
      email: ivan.sebben.dati@gmail.com
  artifacthub.io/changes: |
    - kind: added
      description: Uptime monitors and health checks never keep applications awake or wake them (ignore.* values)
    - kind: added
      description: Routes balancing several Services keep their split; only managed backends sleep and wake
    - kind: added
      description: OpenShift DeploymentConfigs (Role covers apps.openshift.io with rbac.openshiftRoutes)
    - kind: fixed
      description: Deleting a route restores every Ingress/Route it patched
    - kind: fixed
      description: Route target ports are resolved and restored exactly
