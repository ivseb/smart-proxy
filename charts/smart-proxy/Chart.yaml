apiVersion: v2
name: smart-proxy
description: Intelligent request handling for Kubernetes Ingresses and OpenShift Routes — auto-sleep, dependency chains and unified route patching.
type: application
# Chart version. Bump on every change to the chart itself.
version: 0.5.0
# Version of the Smart Proxy application shipped by default.
appVersion: "2.3.0"
home: https://ivseb.github.io/smart-proxy/
icon: https://raw.githubusercontent.com/ivseb/smart-proxy/main/media/logo.png
sources:
  - https://github.com/ivseb/smart-proxy
maintainers:
  - name: ivseb
keywords:
  - proxy
  - kubernetes
  - openshift
  - ingress
  - autoscaling
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ivseb/smart-proxy
    - name: documentation
      url: https://ivseb.github.io/smart-proxy/
  artifacthub.io/images: |
    - name: smart-proxy
      image: docker.io/isebben/smart-proxy:2.3.0
  artifacthub.io/maintainers: |
    - name: ivseb
      email: ivan.sebben.dati@gmail.com
  artifacthub.io/changes: |
    - kind: added
      description: Requests inspector - record a route's requests and see what was sent and what Smart Proxy did with each
    - kind: added
      description: Backends with conditions (header, cookie, query, path, client IP), sticky across cross-site posts such as SAML responses
    - kind: added
      description: Built-in protection - sign-in page (shared password or people) and access tokens, X-Smart-Proxy-User for the app
    - kind: changed
      description: Smart Proxy keeps its own Secret (<release>-state); the chart grants access to it
