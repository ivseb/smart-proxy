# Default values for smart-proxy.
# Every option can be overridden on the command line (--set key=value)
# or with a custom values file (-f my-values.yaml).
# See values.example.yaml for a documented production example.

# Number of Smart Proxy replicas. Keep at 1 unless you configure leader election.
replicaCount: 1

image:
  # Container image published to Docker Hub.
  repository: docker.io/isebben/smart-proxy
  # Image tag. An empty string defaults to the chart's appVersion.
  # Pin this to a released version (e.g. "1.0.0") in production.
  tag: ""
  pullPolicy: Always

# Secrets used to pull the image from a private registry (usually not needed).
imagePullSecrets: []

# Override the generated resource names.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount for Smart Proxy.
  create: true
  # Name of the ServiceAccount. Generated from the release name when empty.
  name: ""
  annotations: {}

rbac:
  # Create the Role + RoleBinding that let Smart Proxy read and patch
  # Deployments, Services, Pods and Ingresses in the release namespace.
  create: true
  # Also grant permissions on OpenShift Routes (route.openshift.io).
  # Set to false on vanilla Kubernetes clusters.
  openshiftRoutes: true

# Application configuration (mapped to the container environment variables).
config:
  # Which namespaces Smart Proxy manages (its Ingresses, Routes and Deployments):
  #   - nothing set:          only the release namespace
  #   - watchNamespaces:      an explicit list; a Role is created in each of them
  #   - allNamespaces: true   every namespace (ClusterRole)
  #   - namespaceSelector:    every namespace whose labels match, e.g. "smart-proxy=enabled";
  #                           label a namespace to onboard it, no reinstall needed (ClusterRole)
  watchNamespaces: []
  allNamespaces: false
  namespaceSelector: ""
  # Deprecated: single namespace, replaced by watchNamespaces.
  watchNamespace: ""
  # Port the proxy listens on (SMART_PROXY_PORT).
  proxyPort: 8080
  # Port the admin dashboard listens on.
  adminPort: 8081
  # Log verbosity: debug | info | error.
  logLevel: info

service:
  type: ClusterIP
  # Service port exposing the proxy.
  proxyPort: 80
  # Service port exposing the admin dashboard.
  adminPort: 8081

# Admin dashboard authentication. Pick the mode that fits your cluster:
#   basic     - username/password prompt (default; password generated if empty)
#   token     - shared access token on a login page, or "Authorization: Bearer" for scripts
#   oidc      - single sign-on via OpenID Connect (Keycloak, Entra ID, Google, Okta, Dex...)
#   openshift - OpenShift login through an oauth-proxy sidecar (requires route or ingress)
#   header    - trust a user header from your own auth proxy (oauth2-proxy, Authelia...)
#   none      - no authentication; only if the dashboard is never exposed
# Generated secrets are stored in the "<release>-auth" Secret and kept across upgrades.
auth:
  mode: basic
  # Use your own Secret instead of the generated one. Keys read, depending on mode:
  # basic-password, token, oidc-client-secret, session-secret, cookie-secret.
  existingSecret: ""
  # How long a token/OIDC login lasts.
  sessionTTL: 12h

  basic:
    username: admin
    # Empty = generate a random password (see the install notes to read it).
    password: ""

  token:
    # Empty = generate a random token.
    token: ""

  oidc:
    # e.g. https://keycloak.example.com/realms/main or https://accounts.google.com
    issuerURL: ""
    clientID: ""
    clientSecret: ""
    # Empty = <route/ingress URL>/auth/callback. Register it in your identity provider.
    redirectURL: ""
    scopes: openid,email,profile
    # Claim shown as the user name.
    usernameClaim: email
    # Claim holding the user's groups (for allowedGroups).
    groupsClaim: groups
    # Who may sign in: a user matching any list is allowed. At least one is required
    # unless allowAll is true (which admits every user of the identity provider).
    allowedEmails: []
    allowedDomains: []
    allowedGroups: []
    allowAll: false

  header:
    # Header carrying the authenticated user name.
    userHeader: X-Forwarded-User
    # Optional sign-out URL of your auth proxy (e.g. /oauth2/sign_out).
    logoutURL: ""
    # WARNING: anyone who can reach the admin port directly can forge this header.
    # Restrict it with a NetworkPolicy so only your auth proxy can connect.

  openshift:
    image: quay.io/openshift/origin-oauth-proxy:4.16
    # SubjectAccessReview a user must pass to get in. Empty = users who can update
    # Services in the release namespace (e.g. "edit" or "admin" role holders).
    sar: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Expose the admin dashboard through a Kubernetes Ingress.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: smart-proxy-admin.example.com
  # Set to true to add a TLS block (expects a "<release>-smart-proxy-tls" secret).
  tls: false

# Expose the admin dashboard through an OpenShift Route.
route:
  enabled: false
  host: smart-proxy-admin.example.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# On "helm uninstall", run a Job that points every patched Ingress/Route back to its
# original Service and wakes every sleeping Deployment, so applications keep working
# without Smart Proxy. Skipped with "helm uninstall --no-hooks" (then run
# "smart-proxy restore" yourself, see the docs).
restoreOnUninstall: true

# Container resource requests/limits.
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Smart Proxy stores runtime data in /data.
persistence:
  # false = ephemeral emptyDir (data lost on pod restart).
  # true  = provision a PersistentVolumeClaim.
  enabled: false
  size: 1Gi
  storageClass: ""

# Pod-level securityContext. With persistence on vanilla Kubernetes the volume may be
# owned by root; set "fsGroup: 1001" so Smart Proxy can write to it. Leave empty on
# OpenShift, which assigns an fsGroup automatically.
podSecurityContext: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
