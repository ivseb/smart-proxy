# Example production overrides for Smart Proxy on OpenShift.
#
# Usage:
#   helm install smart-proxy ./charts/smart-proxy \
#     --namespace my-namespace --create-namespace \
#     -f charts/smart-proxy/values.example.yaml

image:
  # Empty = the chart's appVersion (the release it was tested with).
  tag: ""

config:
  logLevel: info
  # Manage the release namespace only (default), a list, or labelled namespaces:
  # watchNamespaces: [team-a, team-b]
  # namespaceSelector: smart-proxy=enabled
  watchNamespaces: []

# Expose the admin dashboard via an OpenShift Route.
# On vanilla Kubernetes use `ingress` instead and set `rbac.openshiftRoutes: false`.
route:
  enabled: true
  host: smart-proxy-admin.apps.example.com

# Persist runtime data across pod restarts.
persistence:
  enabled: true
  size: 1Gi
  # storageClass: gp3

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
