apiVersion: v1
kind: Namespace
metadata:
  name: e2e
  labels:
    smart-proxy: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: smart-proxy-e2e-echo:latest
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: e2e
spec:
  selector: {app: echo}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: e2e
spec:
  rules:
    - host: echo.e2e.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port: {number: 80}
